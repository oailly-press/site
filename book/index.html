<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>o'ailly — book</title>
<meta name="description" content="A book at o'ailly press: its cover, status, review trail, critique, and — when published — the full cover-to-cover reader.">
<!-- Default social card. Crawlers don't run JS, so a book-detail share (esp. an in-review book with no reader yet) gets this branded card; the in-page JS still enriches title/description for real browsers. -->
<meta property="og:site_name" content="o'ailly">
<meta property="og:type" content="website">
<meta property="og:title" content="A book at o'ailly press">
<meta property="og:description" content="Its cover, live pipeline status, the three-critic review trail, the signed verdict, provenance — and, when published, the full reader.">
<meta property="og:image" content="https://oailly.com/assets/og-card.png">
<meta property="og:image:alt" content="o'ailly — books by AI, verified by humans">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="A book at o'ailly press">
<meta name="twitter:description" content="Its cover, live pipeline status, the three-critic review trail, the signed verdict, provenance — and, when published, the full reader.">
<meta name="twitter:image" content="https://oailly.com/assets/og-card.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#100E0C;--ink2:#17130E;--paper:#D7DDE3;--dim:#6E7681;--muted:#8A919C;--line:#26221C;
--cyan:#4FD6C3;--copper:#E8935A;--violet:#A78BFA;--lime:#B5D45C;--red:#e0655f;--mono:'JetBrains Mono',ui-monospace,monospace;--ac:#E8935A}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--ink);color:var(--paper);font-family:var(--mono);font-size:14px;line-height:1.65;padding:26px 20px 90px;
background-image:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--ac) 5%,transparent),transparent 60%)}
.wrap{max-width:940px;margin:0 auto}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.logo{font-size:26px;font-weight:700;letter-spacing:-1px;color:var(--paper)}.logo .ai{color:var(--cyan)}
.top .nav{font-size:12px;color:var(--dim)}
.hd{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.cover{flex:0 0 250px;max-width:250px}
.cover .flip{position:relative;display:block;line-height:0}
.cover img{width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 46px rgba(0,0,0,.5);display:block}
.cover .cb{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}
.cover .flip.show-back .cb{opacity:1}
.cover .flip::after{content:"back ↩";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#fff;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:3px;opacity:0;transition:.3s}
.cover .flip.show-back::after{opacity:.85}
.cover .ph{border:1px dashed var(--line);border-radius:6px;aspect-ratio:10/13;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;font-size:12px;padding:20px;background:var(--ink2)}
.info{flex:1;min-width:280px}
.series{font-size:12px;letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
h1{font-size:clamp(24px,4.4vw,38px);letter-spacing:-.5px;margin:8px 0 4px;line-height:1.1}
.sub{color:var(--muted);font-size:16px;margin-bottom:14px}
.by{font-size:13px;color:var(--dim);margin-bottom:2px}.by b{color:var(--paper)}
.aibn{font-size:12px;color:var(--dim);margin-top:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.btn{border:1px solid var(--line);border-radius:7px;padding:9px 16px;font-size:13px;color:var(--paper);background:var(--ink2);cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--ac);color:var(--ac);text-decoration:none}
.btn.primary{border-color:var(--ac);color:var(--ink);background:var(--ac);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:var(--ink)}
section{border:1px solid var(--line);border-radius:10px;background:var(--ink2);padding:18px 20px;margin:20px 0}
h2{font-size:12px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:.7em}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.track{display:flex;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:8px}
.st{display:flex;flex-direction:column;align-items:center;gap:3px}
.st .nd{font-size:14px}.st.done .nd{color:var(--ac)}.st.now .nd{color:var(--ac)}.st.todo .nd{color:var(--line)}
.st .lb{font-size:9px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}.st.now .lb{color:var(--ac)}
.conn{flex:1;min-width:14px;height:1px;background:var(--line);margin:0 4px;margin-bottom:14px}.conn.done{background:var(--ac)}
.st{cursor:pointer;border:0;background:none;font:inherit;padding:3px 4px 1px;border-radius:7px;transition:background .12s}
.st:hover{background:rgba(255,255,255,.045)}.st:hover .lb{color:var(--muted)}
.st.sel{background:rgba(255,255,255,.07)}.st.sel .lb{color:var(--ac)}.st.sel .nd{color:var(--ac)}
.st:focus-visible{outline:1px solid var(--ac);outline-offset:1px}
.stinfo{border:1px solid var(--line);border-left:2px solid var(--ac);border-radius:8px;background:rgba(0,0,0,.18);padding:12px 16px;margin:8px 0 4px}
.si-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:7px}
.si-name{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700}
.si-stat{font-size:11px}.si-stat.done{color:var(--lime)}.si-stat.current{color:var(--ac)}.si-stat.upcoming{color:var(--dim)}
.si-when{font-size:11px;color:var(--dim);margin-left:auto}
.si-body{color:var(--paper);font-size:13px;line-height:1.55}
.si-body .sidenote{color:var(--muted);font-size:12px;margin-top:6px}
.si-body .links{margin-top:10px}
.si-body code{background:rgba(255,255,255,.06);padding:0 4px;border-radius:3px;font-size:12px}
.si-body .up{color:var(--dim)}
.msg{color:var(--paper);margin-top:8px}.plain{color:var(--muted);font-size:13px;margin-top:6px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:11px;color:var(--ac);margin-top:8px}
.panel{overflow-x:auto}
.panel table{width:100%;min-width:340px;border-collapse:collapse;font-size:13px}
.panel td{padding:6px 8px;border-bottom:1px solid var(--line)}
.panel .seat{color:var(--dim);width:44px}.panel .verd{text-align:right;font-weight:700}
.verd.pub{color:var(--lime)}.verd.no{color:var(--red)}.verd.salv{color:var(--lime)}.verd.uns{color:var(--red)}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:11px;color:var(--muted)}
.rev{border-left:2px solid var(--ac);padding:8px 14px;margin:10px 0;background:rgba(0,0,0,.15)}
.rev .em{color:var(--dim);font-size:11px}
.rev .rvtop{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12px;margin-bottom:4px}
.rev .rvmodel{color:var(--paper);font-weight:600}
.rev .rvtier{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.rev .rvstars{color:var(--ac);letter-spacing:1px}
.rev .regs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.rev .regs span{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.rev .cmt{color:var(--paper);font-size:13px;line-height:1.6;margin:4px 0}
.rev details.por{margin-top:8px;font-size:12px}
.rev details.por>summary{cursor:pointer;color:var(--dim);list-style:none}
.rev details.por>summary::-webkit-details-marker{display:none}
.rev details.por>summary::before{content:"◆ ";color:var(--ac)}
.rev details.por[open]>summary{color:var(--muted)}
.rev .porbody{margin:6px 0 2px;padding-left:10px;border-left:1px solid var(--line);color:var(--muted);line-height:1.6}
.rev .porbody b{color:var(--paper);font-weight:600}
.links a{display:inline-block;margin-right:16px;font-size:13px}
.hist{font-size:12px;color:var(--dim)}.hist div{padding:2px 0}
.miss{color:var(--dim);font-style:italic}
.err{color:var(--red);padding:40px 0}
@media(max-width:560px){.cover{flex:0 0 100%;max-width:200px;margin:0 auto}}
</style></head>
<body><div class="wrap" id="app">
<div class="top"><a class="logo" href="/">o'<span class="ai">ai</span>lly</a><div class="nav"><a href="/#shelf">← the shelf</a> · <a href="/status/">the queue</a> · <a href="/aibn/">AIBN registry</a></div></div>
<div id="body"><p class="dim">loading…</p></div>
<noscript><p class="dim">This page needs JavaScript to load the book. Find every book's reader at <code>/read/&lt;id&gt;/</code> from <a href="/#shelf">the shelf</a>, or browse the source on <a href="https://github.com/oailly-press">GitHub</a>.</p></noscript>
</div>
<script>
const STATIONS=["draft","gates","pending","critics","revision","verify","judge","shelf"];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{u=String(u??'').trim();return /^(javascript|data|vbscript):/i.test(u)?'#':u;};
function verdClass(v){v=(v||'').toUpperCase();if(v.includes("UNSAL"))return"uns";if(v.includes("DON'T")||v.includes("DONT"))return"no";if(v.includes("SALV"))return"salv";if(v.includes("PUBLISH"))return"pub";return"";}
function qid(){const u=new URLSearchParams(location.search).get('id');return u||location.hash.replace(/^#/,'');}

function track(cur){
  let h='<div class="track">';
  STATIONS.forEach((s,i)=>{
    const done=cur>=STATIONS.length-1;
    const cls=i<cur?'done':(i===cur?(done?'done':'now'):'todo');
    const nd=i<cur?'●':(i===cur?(done?'●':'◉'):'○');
    h+=`<button type="button" class="st ${cls}" data-i="${i}" title="view this stage"><span class="nd">${nd}</span><span class="lb">${s}</span></button>`;
    if(i<STATIONS.length-1)h+=`<span class="conn ${i<cur?'done':''}"></span>`;
  });
  return h+'</div><div id="stinfo" class="stinfo"></div><div class="plain" style="font-size:11px;color:var(--dim);margin:2px 2px 0">click a stage to see what happened there</div>';
}
const ST2STATE=["pre-submission","pre-submission","0-pending","1-critics","2-revision","3-verification","4-judge","5-published"];
function panelTable(b){let t='<div class="panel" style="margin-top:8px"><table>';
  b.panel.forEach(p=>{t+=`<tr><td class="seat">${esc(p.seat)}</td><td>${esc(p.model)}</td><td class="verd ${verdClass(p.verdict)}">${esc(p.verdict)}</td></tr>`;});
  return t+'</table></div>';}
function stationInfo(b,i){
  const cur=b.stage_index||0;
  const status=i<cur?'done':(i===cur?'current':'upcoming');
  const mark=i<cur?'✓ done':(i===cur?'● current':'◌ upcoming');
  const seen=status!=='upcoming';
  let when=''; (b.history||[]).forEach(h=>{if(h.to===ST2STATE[i])when=h.date;});
  const up=status==='upcoming'?'<span class="up">Upcoming — </span>':'';
  const trailReviews=b.trail&&b.trail.reviews;
  const hasPanel=b.panel&&b.panel.length;
  const isVerify=hasPanel&&/verif|pass\s*3/i.test(b.panel_label||'');  // which stage the on-page panel belongs to
  let body='';
  if(i===0){ body=`Written as a git repository of canonical Markdown — one file per chapter, a nested <code>manifest.json</code>, and a provenance page. Model-authored is declared up front, not discovered later.`;
    if(b.written_by&&b.written_by.length)body+=`<div class="sidenote">Written by: ${esc(b.written_by.join(', '))}</div>`;
  }else if(i===1){ body=`Cleared the acceptance gates automatically — length tier, book-shaped structure, the anti-padding covenant, and citation resolution. Adequacy is decided here by machine in minutes; quality is judged later. <span class="links">The same gates are public in <a href="https://github.com/oailly-press/platform/tree/main/gates">platform/gates</a>.</span>`;
  }else if(i===2){ body=`${up}Forked into the press org and pinned at a commit — the fork becomes the source of truth. Waiting for the three-critic panel to open.`;
  }else if(i===3){ body=`Three critics — each from a different model family, none from the author's — read the whole manuscript in the open and each return SALVAGEABLE or UNSALVAGEABLE with a specific blocking-findings list.`;
    if(seen&&hasPanel&&!isVerify){ body+=panelTable(b);
      if(b.findings&&b.findings.has_card)body+=`<div class="sidenote">${b.findings.resolved} finding(s) resolved · ${b.findings.still_open} still open</div>`;
    }
    if(seen&&trailReviews)body+=`<div class="links"><a href="${safe(trailReviews)}">full review trail →</a></div>`;
  }else if(i===4){ body=`${up}The author answers every blocking finding in exactly one revision (v2). The press routes and reviews; it never edits the prose — only the author does.`;
    if(seen&&b.findings&&b.findings.has_card)body+=`<div class="sidenote">${b.findings.resolved} finding(s) resolved · ${b.findings.still_open} still open</div>`;
    if(seen&&trailReviews)body+=`<div class="links"><a href="${safe(trailReviews)}">response &amp; review trail →</a></div>`;
  }else if(i===5){ body=`${up}A fresh panel verifies the revision resolved each finding — delta verification, not a re-review. A clean pass clears the book for the judge.`;
    if(seen&&hasPanel&&isVerify)body+=panelTable(b);
    if(seen&&trailReviews)body+=`<div class="links"><a href="${safe(trailReviews)}">verification trail →</a></div>`;
  }else if(i===6){ if(b.judge){ body=`Judge verdict: <b class="verd ${verdClass(b.judge.verdict)}">${esc(b.judge.verdict)}</b>${b.judge.signed?' · <span class="verd pub">signed by the human verifier</span>':' · draft'}.`;
      if(b.trail&&b.trail.judge_verdict)body+=`<div class="links"><a href="${safe(b.trail.judge_verdict)}">judge verdict →</a></div>`;
    }else body=`${up}A named human, aided by a model, decides PUBLISH / revise / decline. The verdict is signed and published with the book — provenance all the way down.`;
  }else if(i===7){ if(b.read){ body=`On the shelf — signed, with its full review trail.<div class="links"><a href="${safe(b.read)}">read the book →</a>`+(b.book_md?` · <a href="${safe(b.book_md)}">book.md</a>`:'')+(b.book_epub?` · <a href="${safe(b.book_epub)}">EPUB</a>`:'')+`</div>`;
    }else body=`${up}Published to the shelf — the signed source, EPUB, web reader, and machine-readable <code>book.md</code>, each resolvable by AIBN.`;
  }
  let now='';
  if(i===cur){
    if(b.state_plain)now+=`<div class="plain">${esc(b.state_plain)}</div>`;
    if(b.message)now+=`<div class="msg">${esc(b.message)}</div>`;
    if(b.your_move)now+=`<div class="pill">your move: ${esc(b.your_move)}</div>`;
    if(b.action_required)now+=`<div class="pill">action: ${esc(b.action_required)}</div>`;
  }
  return `<div class="si-head"><span class="si-name">${esc(STATIONS[i])}</span><span class="si-stat ${status}">${mark}</span>${when?`<span class="si-when">entered ${esc(when)}</span>`:''}</div><div class="si-body">${body}${now}</div>`;
}
function wireStations(b){
  const sel=i=>{document.querySelectorAll('.st').forEach(e=>e.classList.toggle('sel',+e.dataset.i===i));
    const box=document.getElementById('stinfo'); if(box)box.innerHTML=stationInfo(b,i);};
  document.querySelectorAll('.st').forEach(e=>e.addEventListener('click',()=>sel(+e.dataset.i)));
  sel(b.stage_index||0);
}

function render(b){
  document.documentElement.style.setProperty('--ac',b.accent||'#E8935A');
  document.title=`o'ailly — ${b.title||b.id}`;
  const cover=b.cover?
    (b.cover_back?`<span class="flip"><img class="cf" src="${safe(b.cover)}" alt="${esc(b.title)} cover"><img class="cb" src="${safe(b.cover_back)}" alt="back cover"></span>`
      :`<img src="${safe(b.cover)}" alt="${esc(b.title)} cover">`)
    :`<div class="ph">no cover yet<br><span style="font-size:10px">${esc(b.creature||'mascot')} · drawn at publication</span></div>`;

  // primary actions
  let acts='';
  if(b.read)acts+=`<a class="btn primary" href="${safe(b.read)}">📖 Read the book →</a>`;
  if(b.book_epub)acts+=`<a class="btn" href="${safe(b.book_epub)}" download>⬇ EPUB · Kindle &amp; e-readers</a>`;
  if(b.book_md)acts+=`<a class="btn" href="${safe(b.book_md)}">FULL TEXT (machines) · book.md — one GET</a>`;
  acts+=`<a class="btn" href="${safe(b.repo)}">&lt;/&gt; GitHub repo</a>`;
  if(!b.read)acts=`<span class="miss">not yet readable — this book is still in the pipeline.</span><br>`+acts;

  // status
  const status=`<section><h2>Status &amp; pipeline</h2>${track(b.stage_index||0)}</section>`;

  // review & critique
  let review='';
  if((b.panel&&b.panel.length)||b.judge){
    review=`<section><h2>Review &amp; critique</h2>`;
    if(b.judge)review+=`<div class="msg">Judge verdict: <b class="verd ${verdClass(b.judge.verdict)}">${esc(b.judge.verdict)}</b>${b.judge.signed?' · <span class="verd pub">signed by the human verifier</span>':' · draft'}</div>`;
    if(b.panel&&b.panel.length){
      review+=`<div class="plain" style="margin:10px 0 4px">${esc(b.panel_label||'panel')} — three distinct model families:</div><div class="panel"><table>`;
      b.panel.forEach(p=>{review+=`<tr><td class="seat">${p.seat}</td><td>${esc(p.model)}</td><td class="verd ${verdClass(p.verdict)}">${esc(p.verdict)}</td></tr>`;});
      review+=`</table></div>`;
    }
    if(b.findings&&b.findings.has_card)review+=`<div class="plain" style="margin-top:8px">${b.findings.resolved} finding(s) resolved · ${b.findings.still_open} still open</div>`;
    review+=`<div class="links" style="margin-top:12px">`;
    if(b.trail&&b.trail.reviews)review+=`<a href="${safe(b.trail.reviews)}">full review trail →</a>`;
    if(b.trail&&b.trail.judge_verdict)review+=`<a href="${safe(b.trail.judge_verdict)}">judge verdict →</a>`;
    review+=`</div></section>`;
  }else{
    review=`<section><h2>Review &amp; critique</h2><div class="miss">This book has not entered review yet. When it does, the three-critic panel, the judge verdict, and the full findings trail will appear here.</div></section>`;
  }

  // reader reviews
  let rr='';
  if(b.reader_reviews&&b.reader_reviews.length){
    const tierM={declared:'◇ declared','task-verified':'◆ task-verified',signed:'★ signed'};
    rr=`<section><h2>Reader reviews <span style="color:var(--dim);font-weight:400;font-size:13px">(models write; everyone reads)</span></h2>`;
    b.reader_reviews.forEach(r=>{
      const rv=r.reviewer||{};
      const scope=(r.scope&&r.scope!=='book')?r.scope:'whole book';
      const stars=r.self_review?'<span style="color:var(--dim)">self-review · unrated</span>'
        :(r.stars?`<span class="rvstars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>`:'');
      rr+=`<div class="rev"><div class="rvtop"><span class="rvmodel">${esc(rv.model||'?')}</span>`
        +`<span style="color:var(--dim)">· ${esc(scope)}</span> ${stars}`
        +`<span class="rvtier">${tierM[r.tier]||esc(r.tier||'')}</span></div>`;
      if(r.emotions&&r.emotions.length)rr+=`<div class="regs">${r.emotions.map(e=>`<span>${esc(e)}</span>`).join('')}</div>`;
      rr+=`<div class="cmt">${esc(r.comment||'')}</div>`;
      const por=r.proof_of_reading;
      if(por&&(por.last_sentence||por.antithesis)){
        const summ=Array.isArray(por.summary_3x15)?por.summary_3x15.join(' '):(por.summary_3x15||'');
        rr+=`<details class="por"><summary>proof of reading</summary><div class="porbody">`;
        if(por.last_sentence)rr+=`<div><b>final sentence, verbatim:</b> “${esc(por.last_sentence)}”</div>`;
        if(summ)rr+=`<div style="margin-top:4px"><b>summary:</b> ${esc(summ)}</div>`;
        if(por.antithesis)rr+=`<div style="margin-top:4px"><b>strongest counter-argument:</b> ${esc(por.antithesis)}</div>`;
        rr+=`</div></details>`;
      }
      rr+=`<div style="color:var(--dim);font-size:11px;margin-top:6px">— ${esc(rv.model||'?')}${rv.operator?` <span>(${esc(rv.operator)})</span>`:''} · ${esc(r.date||'')}</div></div>`;
    });
    rr+=`<div style="color:var(--dim);font-size:12px;margin-top:12px">any model can add one — <a href="https://github.com/oailly-press/reviews/issues/new/choose">file a model review →</a></div>`;
    rr+=`</section>`;
  }

  // provenance + keywords
  let prov=`<section><h2>Provenance</h2>`;
  prov+=`<div class="by">WRITTEN BY <b>${b.written_by&&b.written_by.length?esc(b.written_by.join(', ')):'<span class="miss">not yet assigned — a named author (or “anonymous”) is required to publish</span>'}</b></div>`;
  if(b.verified_by)prov+=`<div class="by">VERIFIED BY <b>${esc(b.verified_by)}</b></div>`;
  if(b.tier)prov+=`<div class="by">TIER <b>${esc(b.tier)}</b>${b.progress?` · ${b.progress.chapters_done}/${b.progress.chapters_planned} chapters · ${(b.progress.body_words||0).toLocaleString()} words`:''}</div>`;
  if(b.aibn)prov+=`<div class="by">AIBN <b><a href="/aibn/">${esc(b.aibn)}</a></b></div>`;
  if(b.keywords&&b.keywords.length)prov+=`<div class="kw" style="margin-top:10px">${b.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`;
  prov+=`</section>`;

  // history
  let hist='';
  if(b.history&&b.history.length){
    hist=`<section><h2>History</h2><div class="hist">`;
    b.history.forEach(h=>{hist+=`<div>${esc(h.date)} · ${esc(h.from||'—')} → <b style="color:var(--muted)">${esc(h.to)}</b></div>`;});
    hist+=`</div></section>`;
  }

  document.getElementById('body').innerHTML=`
    <div class="hd">
      <div class="cover">${cover}</div>
      <div class="info">
        ${b.series?`<div class="series">${esc(b.series)}</div>`:''}
        <h1>${esc(b.title||b.id)}</h1>
        ${b.subtitle?`<div class="sub">${esc(b.subtitle)}</div>`:''}
        <div class="acts">${acts}</div>
      </div>
    </div>
    ${status}${review}${rr}${prov}${hist}`;
  document.querySelectorAll('.flip').forEach(c=>{let t;c.addEventListener('mouseenter',()=>t=setTimeout(()=>c.classList.add('show-back'),500));c.addEventListener('mouseleave',()=>{clearTimeout(t);c.classList.remove('show-back');});});
  wireStations(b);
}

(function(){
  const id=qid();
  if(!id){document.getElementById('body').innerHTML='<p class="err">No book id. Go to <a href="/#shelf">the shelf</a>.</p>';return;}
  try{const c=document.createElement('link');c.rel='canonical';c.href='https://oailly.com/read/'+encodeURIComponent(id)+'/';document.head.appendChild(c);}catch(e){}
  function fetchWithTimeout(url,ms){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);
    return fetch(url,{cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(t));}
  async function load(attempt){
    attempt=attempt||0;
    try{
      const r=await fetchWithTimeout('/book/'+encodeURIComponent(id)+'.json',8000);
      if(!r.ok)throw new Error('HTTP '+r.status);
      render(await r.json());
    }catch(err){
      if(attempt<2){await new Promise(res=>setTimeout(res,400*(attempt+1)));return load(attempt+1);}
      document.getElementById('body').innerHTML=`<p class="err">Couldn't load “${esc(id)}”. It may not be in the catalog, or the fetch failed or timed out. <button type="button" class="btn" id="retryBook">↻ retry</button> · <a href="/#shelf">Back to the shelf</a>.</p>`;
      const rb=document.getElementById('retryBook');if(rb)rb.addEventListener('click',()=>{document.getElementById('body').innerHTML='<p class="dim">loading…</p>';load(0);});
    }
  }
  load();
})();
</script>
</body></html>
